name: Groups v2 exact-source prepublish release-chain rehearsal (NO DEPLOY)
on:
  push:
    branches:
      - qa/groups-v2-prepublish-chain-1.1.24-20261028
permissions:
  contents: read
jobs:
  prepublish-chain:
    name: full P5 and release integrity on immutable candidate source
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact source SHA (not QA trigger source)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d0114c008c426c6dcbdf4dae9adfc5adcb4db3ef
          fetch-depth: 0
          persist-credentials: false
      - name: Locked Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies and pinned Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d0114c008c426c6dcbdf4dae9adfc5adcb4db3ef"
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          node scripts/provision-playwright-chromium.mjs
          node -e "console.log('CHROMIUM_PATH='+require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Rehearse protected-style P5 and exact-source release chain without publication
        shell: bash
        env:
          GHRAB_SOURCE_COMMIT: d0114c008c426c6dcbdf4dae9adfc5adcb4db3ef
          GHRAB_SOURCE_REPOSITORY: Daniel22-dev/SORTIO
          GHRAB_RELEASE_STAGE: PREP-VALIDATION
          GARP27_EXTERNAL_TRUST_SHA256: c36546657182c19e9d9a6bfee25856dbfd676f0fa391c2a8cddfc3d953b296c0
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          npm run build:deployment
          npm run qa:p5:ci
          npm run prepare:pages
          npm run verify:release-chain
          echo 'RELEASE CHAIN CHECKED - TRANSITIONAL UNSIGNED - NO DEPLOY - NONCERTIFYING'
      - name: Check source checkout did not move to production
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d0114c008c426c6dcbdf4dae9adfc5adcb4db3ef"
          echo 'NO PAGES DEPLOYMENT OCCURRED; prod authorization and live UAT pending'
