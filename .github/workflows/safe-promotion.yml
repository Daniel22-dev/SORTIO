name: Safe Promotion guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate-to-main:
    name: candidate-to-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enforce Safe Promotion topology
        env:
          SAFE_PROMOTION_HEAD: ${{ github.head_ref }}
          SAFE_PROMOTION_BASE: ${{ github.base_ref }}
        run: node scripts/qa-safe-promotion.mjs
      - name: Verify N5 fail-closed controls
        run: node security/garp25/tools/selftest-garp251.mjs
      - name: Verify pinned GitHub Actions
        run: node scripts/check-action-pins.mjs
