name: SORTIO Verify and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SORTIO_CI_MODE: deterministic

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Verify and publish SORTIO
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Verify production structure
        run: node scripts/verify-structure.mjs

      - name: Run production and domain tests
        shell: bash
        run: |
          set -euo pipefail
          node scripts/domain-tests.mjs
          node scripts/package3-runtime-tests.mjs
          node scripts/package4-runtime-tests.mjs
          node scripts/package5-runtime-tests.mjs

      - name: Build production files
        run: node scripts/build.mjs

      - name: Run internal regression suite
        run: node scripts/package5-internal-tests.mjs

      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Run unified error reporter regression
        run: npm run test:reporter

      - name: Run deterministic QA gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa-technical.mjs
          node scripts/qa-security.mjs
          node scripts/qa-pwa.mjs
          node scripts/qa-combinatorial.mjs

      - name: Verify prepared build
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/studio-manifest.json
          node -e "const p=require('./package.json'); const m=require('./dist/studio-manifest.json'); if(m.id!=='sortio'||m.version!==p.version||!m.launchUrl) process.exit(1)"
          touch dist/.nojekyll

      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform

      - name: Enforce P5 R2 CI gate
        run: npm run qa:p5:ci

      - name: Enforce full GARP 2.5.1 production release gate
        run: npm run garp25:prep-static

      - name: Generate and verify LIVE release identity
        shell: bash
        env:
          GHRAB_SOURCE_REPOSITORY: ${{ github.repository }}
          GHRAB_SOURCE_COMMIT: ${{ github.sha }}
          GHRAB_BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          GHRAB_BUILDER_ID: github-actions
          GHRAB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GHRAB_BUILD_PROFILE: github-pages-live
          GHRAB_BUILD_ENTRYPOINT: npm run garp25:prep-static
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SBOM_SOURCE="security/sbom/sortio-${VERSION}.cdx.json"
          test -f "$SBOM_SOURCE"
          node scripts/stamp-live-release-identity.mjs dist-deployment/studio-manifest.json
          cp "$SBOM_SOURCE" dist-deployment/sbom.cdx.json
          node security/garp25/tools/create-build-provenance.mjs dist-deployment/studio-manifest.json dist-deployment/build-provenance.json
          export GHRAB_BUILD_PROVENANCE_SHA256="$(sha256sum dist-deployment/build-provenance.json | awk '{print $1}')"
          export GHRAB_SBOM_SHA256="$(sha256sum dist-deployment/sbom.cdx.json | awk '{print $1}')"
          node security/garp25/tools/create-release-integrity.mjs dist-deployment sortio "$VERSION" github-actions-live dist-deployment/release-integrity.json
          node scripts/verify-live-release-identity.mjs dist-deployment/release-integrity.json
          npm run garp25:leaks:public

      - name: Verify AI Studio dispatch credential
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AI_STUDIO_DISPATCH_TOKEN:-}" ]; then
            echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Deployment is blocked because AI Studio could not be notified safely."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist-deployment
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Wait for deployed LIVE Studio manifest
        shell: bash
        env:
          EXPECTED_VERSION: ${{ fromJSON(steps.release-meta-placeholder.outputs.value || 'null') }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          manifest_url="https://daniel22-dev.github.io/SORTIO/studio-manifest.json"
          manifest_file="$RUNNER_TEMP/sortio-live-studio-manifest.json"

          for attempt in $(seq 1 18); do
            if curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-time 15 \
              "$manifest_url?run=${GITHUB_RUN_ID}-${attempt}" -o "$manifest_file"; then
              if EXPECTED_VERSION="$EXPECTED_VERSION" EXPECTED_REPOSITORY="$EXPECTED_REPOSITORY" EXPECTED_SHA="$EXPECTED_SHA" \
                node --input-type=module - "$manifest_file" <<'NODE'
import { readFileSync } from 'node:fs';
const file = process.argv[2];
const manifest = JSON.parse(readFileSync(file, 'utf8'));
const repository = String(manifest?.releaseIdentity?.source?.repository || '');
const commit = String(manifest?.releaseIdentity?.source?.commit || '');
const ok = manifest?.id === 'sortio'
  && manifest?.version === process.env.EXPECTED_VERSION
  && repository.toLowerCase() === String(process.env.EXPECTED_REPOSITORY || '').toLowerCase()
  && commit === process.env.EXPECTED_SHA;
if (!ok) process.exit(1);
NODE
              then
                echo "LIVE manifest confirmed for SORTIO ${EXPECTED_VERSION} at ${EXPECTED_SHA}."
                exit 0
              fi
            fi
            sleep 5
          done

          echo "::error::LIVE studio-manifest.json did not reach expected version/repository/source SHA within the bounded retry window."
          exit 1

      - name: Dispatch app-updated event to AI Studio
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_URL="https://daniel22-dev.github.io/SORTIO/studio-manifest.json"

          APP_VERSION="$APP_VERSION" MANIFEST_URL="$MANIFEST_URL" node <<'NODE' > "$RUNNER_TEMP/ai-studio-dispatch.json"
const payload = {
  event_type: 'app-updated',
  client_payload: {
    app_id: 'sortio',
    app_version: process.env.APP_VERSION,
    source_repository: process.env.SOURCE_REPOSITORY,
    source_sha: process.env.SOURCE_SHA,
    deployed_url: process.env.DEPLOYED_URL,
    manifest_url: process.env.MANIFEST_URL,
  },
};
process.stdout.write(JSON.stringify(payload));
NODE

          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AI_STUDIO_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Daniel22-dev/AI-Studio-GHRAB/dispatches \
            --data-binary "@$RUNNER_TEMP/ai-studio-dispatch.json"

          echo "AI Studio dispatch accepted for $SOURCE_REPOSITORY@$SOURCE_SHA version $APP_VERSION"
