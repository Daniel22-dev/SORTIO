name: Blocking axe-core audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify exact axe-core version
        run: node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
      - name: Restore pinned Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-1.61.1-${{ hashFiles('package-lock.json') }}

      - name: Provision pinned Playwright Chromium
        shell: bash
        run: node scripts/provision-playwright-chromium.mjs
      - name: Build application
        run: npm run build
      - name: Run blocking axe audit on executed UI
        run: npm run qa:axe
      - name: Upload axe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axe-p5-r2-${{ github.sha }}
          path: dist/qa-p5-axe-runtime-report.json
