<!doctype html>
<html lang="cs" data-ghrab-access="checking" data-theme="dark" data-ghrab-app-id="sortio" data-ghrab-app-version="1.0.17">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  <meta http-equiv="Content-Security-Policy" content="__STATIC_CSP__">
  <title>SORTIO · Organizátor třídy</title>
  <meta name="theme-color" content="#07101f">
  <meta name="application-name" content="SORTIO">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SORTIO">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./access/access-gate.css">
  <style>html[data-ghrab-access="checking"] body{visibility:hidden}</style>
  <style>/*==SORTIO_STYLES==*/</style>
</head>
<body>
  <!--==SORTIO_BODY==-->
  <script src="./app.js" type="application/ghrab-protected" data-ghrab-protected></script>
  <script type="module" data-ghrab-access-bootstrap>
const APP_ID = 'sortio';
let studioUrl = '/AI-Studio-GHRAB/';

function showAccessBootstrapFailure(title = 'Přístup nelze ověřit', message = 'Centrální přístupová služba není dostupná. Zkontrolujte připojení a otevřete aplikaci znovu přes AI Studio.') {
  document.documentElement.dataset.ghrabAccess = 'denied';
  document.body.style.visibility = 'visible';
  document.body.innerHTML = '<main class="ghrab-access-gate"><div class="ghrab-access-gate-mark">◉</div><p class="ghrab-access-gate-eyebrow">AI STUDIO GHRAB</p><h1></h1><p class="ghrab-access-gate-message"></p><div class="ghrab-access-gate-actions"><a class="ghrab-access-gate-primary" data-ghrab-studio-link>Otevřít AI Studio</a></div></main>';
  document.querySelector('.ghrab-access-gate h1').textContent = title;
  document.querySelector('.ghrab-access-gate-message').textContent = message;
  const link = document.querySelector('[data-ghrab-studio-link]');
  if (link) link.href = studioUrl;
}

function startLocalReporter(context) {
  return import('./access/reporter-bootstrap.js')
    .then((module) => module.startReporterBestEffort('./error-reporter-adapter.js', { context }))
    .catch((error) => {
      console.warn('Lokální bootstrap reportéru nebyl načten; aplikace pokračuje.', error);
      return null;
    });
}

function unlockProtectedScripts() {
  const helper = window.GHRAB_PLATFORM?.unlockProtectedScripts;
  if (typeof helper !== 'function') throw new Error('GHRAB platform unlock helper is unavailable.');
  return helper();
}

function permitAllowsApp(permit) {
  if (!permit || typeof permit !== 'object') return false;
  if (permit.role === 'admin') return true;
  const apps = Array.isArray(permit.apps) ? permit.apps : [];
  return apps.includes('*') || apps.includes(APP_ID) || permit.appId === APP_ID;
}

function frameContextIsAllowed() {
  if (window.top === window.self) return true;
  try {
    return window.top.location.origin === window.location.origin;
  } catch (_) {
    return false;
  }
}

async function boot() {
  try {
    if (!frameContextIsAllowed()) {
      showAccessBootstrapFailure('Přístup v rámci není povolen', 'SORTIO lze vložit pouze do důvěryhodného rámce na stejném původu jako aplikace.');
      return;
    }
    const deploymentModule = await import('./access/deployment-config.js');
    const deployment = await deploymentModule.loadDeploymentConfig({ appId: APP_ID });
    const urls = deploymentModule.deploymentUrls(deployment);
    studioUrl = urls.studioUrl;
    const { protectApp } = await import(urls.guardUrl);
    let grantedPermit = null;
    document.addEventListener('ghrab:app-access-granted', (event) => {
      grantedPermit = event.detail?.permit || null;
    }, { once: true });
    const allowed = await protectApp(APP_ID, { studioUrl, errorReporter: false });
    if (!allowed) return;
    if (!permitAllowsApp(grantedPermit)) {
      throw new Error('Centrální brána nepotvrdila platné oprávnění pro SORTIO.');
    }
    window.__GHRAB_STUDIO_ACCESS__ = Object.freeze({ appId: APP_ID, permit: grantedPermit });
    void startLocalReporter('sortio:granted');
    unlockProtectedScripts();
  } catch (error) {
    console.error('SORTIO access bootstrap failed', error);
    showAccessBootstrapFailure();
    void startLocalReporter('sortio:bootstrap-failure');
  }
}

void boot();
</script>
  <noscript><style>html[data-ghrab-access="checking"] body{visibility:visible}</style><main style="max-width:42rem;margin:4rem auto;padding:1.5rem;font-family:system-ui">SORTIO vyžaduje JavaScript a platný přístup z AI Studia GHRAB.</main></noscript>
</body></html>
